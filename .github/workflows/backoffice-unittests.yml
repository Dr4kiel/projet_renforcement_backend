name: BackOffice Tests

on:
    push:
        branches: [dev]
        paths:
            - "services/backoffice/BackOfficeService/**"
            - "services/backoffice/BackOfficeService.Tests/**"
    pull_request:
        branches: [dev]
        paths:
            - "services/backoffice/BackOfficeService/**"
            - "services/backoffice/BackOfficeService.Tests/**"

jobs:
    test:
        runs-on: ubuntu-latest
        steps:
            - name: Checkout code
              uses: actions/checkout@v3

            - name: Setup .NET
              uses: actions/setup-dotnet@v3
              with:
                  dotnet-version: "10.0.x"

            - name: Restore dependencies
              run: dotnet restore services/backoffice/BackOfficeService.Tests/BackOfficeService.Tests.csproj

            - name: Check code formatting
              run: dotnet format services/backoffice/BackOfficeService.Tests/BackOfficeService.Tests.csproj --verify-no-changes --verbosity diagnostic

            - name: Run code analysis
              run: dotnet build services/backoffice/BackOfficeService.Tests/BackOfficeService.Tests.csproj --no-restore --configuration Release /p:TreatWarningsAsErrors=true /p:EnforceCodeStyleInBuild=true

            - name: Run unit tests
              run: dotnet test services/backoffice/BackOfficeService.Tests/BackOfficeService.Tests.csproj --no-build --configuration Release --verbosity normal --logger "trx;LogFileName=test-results.trx"

            - name: Upload test results
              if: always()
              uses: actions/upload-artifact@v3
              with:
                  name: test-results
                  path: "**/test-results.trx"

version: '3.8'

services:
  # Base de données PostgreSQL
  postgres:
    image: postgres:16-alpine
    container_name: production-dashboard-db
    environment:
      POSTGRES_DB: production_dashboard
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - dashboard-network

  # PG-Admin pour la gestion de PostgreSQL
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: production-dashboard-pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@example.com
      PGADMIN_DEFAULT_PASSWORD: admin
    ports:
      - "8080:80"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - dashboard-network

  # ========== MICROSERVICES ARCHITECTURE ==========

  # Message Broker RabbitMQ
  rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: production-dashboard-rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    ports:
      - "5672:5672"   # AMQP
      - "15672:15672" # Management UI
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - dashboard-network

  # Service Agent Control (RabbitMQ + SignalR)
  agent-control:
    build:
      context: ./services/agent-control
      dockerfile: Dockerfile
    container_name: production-dashboard-agent-control
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - ASPNETCORE_URLS=http://+:5003
      - RabbitMQ__Host=rabbitmq
      - RabbitMQ__Port=5672
      - RabbitMQ__Username=guest
      - RabbitMQ__Password=guest
    expose:
      - "5003"
    depends_on:
      rabbitmq:
        condition: service_healthy
    networks:
      - dashboard-network
    restart: unless-stopped

  # API Gateway (Point d'entrée unique)
  gateway:
    build:
      context: ./gateway
      dockerfile: Dockerfile
    container_name: production-dashboard-gateway
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - ASPNETCORE_URLS=http://+:5050
    ports:
      - "5050:5050"
    depends_on:
      - backoffice
      - realtime
      - agent-control
    networks:
      - dashboard-network
    restart: unless-stopped

  # Service Back-Office (CRUD Operations)
  backoffice:
    build:
      context: ./services/backoffice
      dockerfile: Dockerfile
    container_name: production-dashboard-backoffice
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - ASPNETCORE_URLS=http://+:5001
      - ConnectionStrings__DefaultConnection=Host=postgres;Port=5432;Database=production_dashboard;Username=postgres;Password=postgres
    expose:
      - "5001"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - dashboard-network
    restart: unless-stopped

  # Service Temps Réel (SignalR)
  realtime:
    build:
      context: ./services/realtime
      dockerfile: Dockerfile
    container_name: production-dashboard-realtime
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - ASPNETCORE_URLS=http://+:5002
      - ConnectionStrings__DefaultConnection=Host=postgres;Port=5432;Database=production_dashboard;Username=postgres;Password=postgres
    expose:
      - "5002"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - dashboard-network
    restart: unless-stopped

  # ========== LEGACY MONOLITHIC BACKEND (Commented for reference) ==========
  # backend:
  #   build:
  #     context: ./server
  #     dockerfile: Dockerfile
  #   container_name: production-dashboard-api
  #   environment:
  #     - ASPNETCORE_ENVIRONMENT=Production
  #     - ASPNETCORE_URLS=http://+:8080
  #     - ConnectionStrings__DefaultConnection=Host=postgres;Port=5432;Database=production_dashboard;Username=postgres;Password=postgres
  #   ports:
  #     - "5050:8080"
  #   depends_on:
  #     postgres:
  #       condition: service_healthy
  #   networks:
  #     - dashboard-network
  #   restart: unless-stopped

  # Frontend React
  frontend:
    build:
      context: ./client
      dockerfile: Dockerfile
    container_name: production-dashboard-client
    environment:
      - VITE_API_URL=http://localhost:5000
    ports:
      - "3000:80"
    depends_on:
      - gateway
    networks:
      - dashboard-network
    restart: unless-stopped

  # Agents Python de remplissage de données (s'exécute une seule fois)
  agents:
    build:
      context: ./agents
      dockerfile: Dockerfile
    container_name: production-dashboard-agents
    environment:
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_NAME=production_dashboard
      - DB_USER=postgres
      - DB_PASSWORD=postgres
    depends_on:
      backoffice:
        condition: service_started
      postgres:
        condition: service_healthy
    networks:
      - dashboard-network
    restart: "no"

  # Agent de simulation des lignes de production (tourne en continu)
  line-agent:
    build:
      context: ./agents
      dockerfile: Dockerfile
    container_name: production-dashboard-line-agent
    command: ["python", "-m", "line_agent", "--line-ids", "1", "2"]
    environment:
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_NAME=production_dashboard
      - DB_USER=postgres
      - DB_PASSWORD=postgres
      - AGENT_INTERVAL=5.0
      - AGENT_PRODUCTION_INCREMENT=1
      - AGENT_CHANGEOVER_PROBABILITY=0
      - AGENT_CHANGEOVER_DURATION=30
      - AGENT_LOG_LEVEL=INFO
      - RABBITMQ_HOST=rabbitmq
      - RABBITMQ_PORT=5672
      - RABBITMQ_USER=guest
      - RABBITMQ_PASSWORD=guest
    depends_on:
      agents:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks:
      - dashboard-network
    restart: unless-stopped

volumes:
  postgres_data:
    driver: local

networks:
  dashboard-network:
    driver: bridge

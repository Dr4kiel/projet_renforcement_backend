version: '3.8'

services:
  # Base de données PostgreSQL
  postgres:
    image: postgres:16-alpine
    container_name: production-dashboard-db
    environment:
      POSTGRES_DB: production_dashboard
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - dashboard-network

  # PG-Admin pour la gestion de PostgreSQL
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: production-dashboard-pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@example.com
      PGADMIN_DEFAULT_PASSWORD: admin
    ports:
      - "8080:80"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - dashboard-network

  # API Backend ASP.NET Core avec SignalR
  backend:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: production-dashboard-api
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_URLS=http://+:8080
      - ConnectionStrings__DefaultConnection=Host=postgres;Port=5432;Database=production_dashboard;Username=postgres;Password=postgres
    ports:
      - "5050:8080"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - dashboard-network
    restart: unless-stopped

  # Frontend React
  frontend:
    build:
      context: ./client
      dockerfile: Dockerfile
    container_name: production-dashboard-client
    environment:
      - VITE_API_URL=http://localhost:5050
    ports:
      - "3000:80"
    depends_on:
      - backend
    networks:
      - dashboard-network
    restart: unless-stopped

  # Agents Python de remplissage de données (s'exécute une seule fois)
  agents:
    build:
      context: ./agents
      dockerfile: Dockerfile
    container_name: production-dashboard-agents
    environment:
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_NAME=production_dashboard
      - DB_USER=postgres
      - DB_PASSWORD=postgres
    depends_on:
      backend:
        condition: service_started
      postgres:
        condition: service_healthy
    networks:
      - dashboard-network
    restart: "no"

  # Agent de simulation des lignes de production (tourne en continu)
  line-agent:
    build:
      context: ./agents
      dockerfile: Dockerfile
    container_name: production-dashboard-line-agent
    command: ["python", "-m", "line_agent", "--line-ids", "1", "2"]
    environment:
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_NAME=production_dashboard
      - DB_USER=postgres
      - DB_PASSWORD=postgres
      - AGENT_INTERVAL=5.0
      - AGENT_PRODUCTION_INCREMENT=1
      - AGENT_CHANGEOVER_PROBABILITY=0
      - AGENT_CHANGEOVER_DURATION=30
      - AGENT_LOG_LEVEL=INFO
    depends_on:
      agents:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
    networks:
      - dashboard-network
    restart: unless-stopped

volumes:
  postgres_data:
    driver: local

networks:
  dashboard-network:
    driver: bridge

version: '3.8'

services:
  # Base de données PostgreSQL
  postgres:
    image: postgres:16-alpine
    container_name: production-dashboard-db
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "${POSTGRES_PORT}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - dashboard-network

  # PG-Admin pour la gestion de PostgreSQL
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: production-dashboard-pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD}
    ports:
      - "${PGADMIN_PORT}:80"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - dashboard-network

  # ========== MICROSERVICES ARCHITECTURE ==========

  # API Gateway (Traefik - Point d'entrée unique)
  gateway:
    image: traefik:v3.2
    container_name: production-dashboard-gateway
    ports:
      - "${GATEWAY_PORT}:80"
      - "${GATEWAY_DASHBOARD_PORT}:8080"
    volumes:
      - ./traefik/traefik.yml:/etc/traefik/traefik.yml:ro
      - ./traefik/dynamic:/etc/traefik/dynamic:ro
    networks:
      - dashboard-network
    restart: unless-stopped

  # Service Back-Office (CRUD Operations)
  backoffice:
    build:
      context: ./services/backoffice
      dockerfile: Dockerfile
    container_name: production-dashboard-backoffice
    environment:
      - ASPNETCORE_ENVIRONMENT=${ASPNETCORE_ENVIRONMENT}
      - ASPNETCORE_URLS=http://+:5001
      - ConnectionStrings__DefaultConnection=Host=postgres;Port=5432;Database=${POSTGRES_DB};Username=${POSTGRES_USER};Password=${POSTGRES_PASSWORD}
      - Cors__AllowedOrigins=${CORS_ALLOWED_ORIGINS}
      - Jwt__SecretKey=${JWT_SECRET_KEY}
    expose:
      - "5001"
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:5001/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - dashboard-network
    restart: unless-stopped

  # Service Temps Réel (SignalR)
  realtime:
    build:
      context: ./services/realtime
      dockerfile: Dockerfile
    container_name: production-dashboard-realtime
    environment:
      - ASPNETCORE_ENVIRONMENT=${ASPNETCORE_ENVIRONMENT}
      - ASPNETCORE_URLS=http://+:5002
      - ConnectionStrings__DefaultConnection=Host=postgres;Port=5432;Database=${POSTGRES_DB};Username=${POSTGRES_USER};Password=${POSTGRES_PASSWORD}
      - Cors__AllowedOrigins=${CORS_ALLOWED_ORIGINS}
      - Jwt__SecretKey=${JWT_SECRET_KEY}
    expose:
      - "5002"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - dashboard-network
    restart: unless-stopped

  # ========== LEGACY MONOLITHIC BACKEND (Commented for reference) ==========
  # backend:
  #   build:
  #     context: ./server
  #     dockerfile: Dockerfile
  #   container_name: production-dashboard-api
  #   environment:
  #     - ASPNETCORE_ENVIRONMENT=Production
  #     - ASPNETCORE_URLS=http://+:8080
  #     - ConnectionStrings__DefaultConnection=Host=postgres;Port=5432;Database=production_dashboard;Username=postgres;Password=postgres
  #   ports:
  #     - "5050:8080"
  #   depends_on:
  #     postgres:
  #       condition: service_healthy
  #   networks:
  #     - dashboard-network
  #   restart: unless-stopped

  # Frontend React
  frontend:
    build:
      context: ./client
      dockerfile: Dockerfile
    container_name: production-dashboard-client
    environment:
      - VITE_API_URL=${VITE_API_URL}
    ports:
      - "${FRONTEND_PORT}:80"
    depends_on:
      - gateway
    networks:
      - dashboard-network
    restart: unless-stopped

  # Agents Python de remplissage de données (s'exécute une seule fois)
  agents:
    build:
      context: ./agents
      dockerfile: Dockerfile
    container_name: production-dashboard-agents
    environment:
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_NAME=${POSTGRES_DB}
      - DB_USER=${POSTGRES_USER}
      - DB_PASSWORD=${POSTGRES_PASSWORD}
    depends_on:
      backoffice:
        condition: service_healthy
      postgres:
        condition: service_healthy
    networks:
      - dashboard-network
    restart: "no"

  # Agent de simulation des lignes de production (tourne en continu)
  line-agent:
    build:
      context: ./agents
      dockerfile: Dockerfile
    container_name: production-dashboard-line-agent
    command: ["python", "-m", "line_agent", "--line-ids", "1", "2"]
    environment:
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_NAME=${POSTGRES_DB}
      - DB_USER=${POSTGRES_USER}
      - DB_PASSWORD=${POSTGRES_PASSWORD}
      - AGENT_INTERVAL=${AGENT_INTERVAL}
      - AGENT_PRODUCTION_INCREMENT=${AGENT_PRODUCTION_INCREMENT}
      - AGENT_CHANGEOVER_PROBABILITY=${AGENT_CHANGEOVER_PROBABILITY}
      - AGENT_CHANGEOVER_DURATION=${AGENT_CHANGEOVER_DURATION}
      - AGENT_LOG_LEVEL=${AGENT_LOG_LEVEL}
    depends_on:
      agents:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
    networks:
      - dashboard-network
    restart: unless-stopped

volumes:
  postgres_data:
    driver: local

networks:
  dashboard-network:
    driver: bridge
    name: dashboard-network
